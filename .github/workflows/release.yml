name: Release Alive

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，不带 v，例如 1.5.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set version and GitHub repository defaults
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ("${{ github.event_name }}" -ne "workflow_dispatch") {
            $version = "${{ github.ref_name }}"
          }
          $version = $version.TrimStart("v")
          if (-not $version) { throw "请填写版本号，例如 1.5.1" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $env:ALIVE_RELEASE_VERSION = $version
          $repo = "${{ github.repository }}".Split("/")
          $json = @{ owner = $repo[0]; repo = $repo[1] } | ConvertTo-Json
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'desktop/github-release.json'),
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )
          node scripts/set-release-version.mjs $version
          Get-Content desktop/github-release.json
          node -p "require('./package.json').version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build Windows installer
        run: pnpm package:installer

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Alive ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/installer/Alive-Setup-*.exe
            release/installer/Alive-Setup-*.exe.blockmap
            release/installer/latest.yml
